# Bloque de servidor para Nginx Proxy Manager cuando el VPS ya usa NPM como borde.
# Se copia a  <data de NPM>/nginx/custom/http.conf  (se incluye dentro de `http {}`) y no aparece
# en la interfaz de NPM: es configuración a mano, igual que el resto de bloques de ese archivo.
#
#   Cloudflare (proxied, TLS público)  ─►  NPM :443 (Origin CA de Cloudflare)  ─►  kustodela_router:80
#
# Los hosts con bloque exacto en la UI de NPM (por ejemplo el POS viejo) siguen ganando sobre este
# comodín: nginx prefiere la coincidencia exacta de server_name.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name *.kustodela.com kustodela.com;

    # Cloudflare Origin CA (*.kustodela.com + kustodela.com). Solo es válido si el registro DNS
    # está en modo proxied (nube naranja): quien valida ante el navegador es Cloudflare.
    ssl_certificate     /data/custom_ssl/npm-16/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-16/privkey.pem;

    client_max_body_size 20M;

    access_log /data/logs/kustodela_access.log proxy;
    error_log  /data/logs/kustodela_error.log warn;

    location /.well-known/acme-challenge/ {
        root /data/acme-challenge;
    }

    location / {
        proxy_pass http://kustodela_router:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}
