name: kustodela

# Producción (VPS). Ver infra/README.md.
# Secretos y dominio en ./.env (no versionado). Ids de Zitadel en los .env.production que escribe
# `npm run prod:bootstrap`. Solo Caddy publica puertos.

x-zitadel-bootstrap-volume: &zitadel_bootstrap ./.local/zitadel-bootstrap

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POS_APP_PASSWORD: ${POS_APP_PASSWORD:?}
      POS_MIGRATOR_PASSWORD: ${POS_MIGRATOR_PASSWORD:?}
      POS_MIGRATOR_CREATEDB: "false"
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [internal]

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.17.3}
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?}" --tlsMode external
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: auth.${APP_DOMAIN:?}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"

      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORD}@postgres:5432/zitadel?sslmode=disable

      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Kustodela
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: es
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Kustodela
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      # Obliga a cambiar la contraseña inicial en el primer acceso a la consola.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"

      # Usuario máquina del backend (IAM_OWNER); su PAT se escribe en ./.local/zitadel-bootstrap.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: kustodela-backend
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Kustodela backend
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/backend.pat

      # Cliente del Login v2
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://auth.${APP_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://auth.${APP_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://auth.${APP_DOMAIN}/ui/v2/login/logout?post_logout_redirect=

      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
    volumes:
      - type: bind
        source: *zitadel_bootstrap
        target: /zitadel/bootstrap
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.17.3}
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:auth.${APP_DOMAIN},X-Forwarded-Proto:https
    volumes:
      - type: bind
        source: *zitadel_bootstrap
        target: /zitadel/bootstrap
        read_only: true
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    depends_on:
      zitadel-api:
        condition: service_healthy
    networks: [internal]

  backend:
    build: ./Gorditas_Calerence_Backend
    image: kustodela/backend:latest
    restart: unless-stopped
    # Ids de Zitadel y Stripe (los escribe `npm run prod:bootstrap`; falta hasta entonces).
    env_file:
      - path: ./Gorditas_Calerence_Backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      APP_TZ: ${APP_TZ:-America/Mexico_City}
      # Las URLs de base de datos apuntan al servicio postgres; process.env tiene prioridad sobre .env.production.
      DATABASE_URL: postgresql://pos_app:${POS_APP_PASSWORD}@postgres:5432/kustodela?schema=public&connection_limit=15
      DIRECT_URL: postgresql://pos_migrator:${POS_MIGRATOR_PASSWORD}@postgres:5432/kustodela?schema=public
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-api:
        condition: service_healthy
    networks: [internal]

  # Construye el SPA con .env.production y deja `dist` en el volumen que sirve Caddy. Un solo disparo:
  # `docker compose run --rm frontend-build` para reconstruir tras cambiar código o el .env.production.
  frontend-build:
    build: ./Gorditas_frontend
    image: kustodela/frontend-build:latest
    restart: "no"
    env_file:
      - path: ./Gorditas_frontend/project/.env.production
        required: false
    volumes:
      - pos_dist:/srv/pos
    networks: [internal]

  caddy:
    build: ./infra/caddy
    image: kustodela/caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pos_dist:/srv/pos:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    networks: [internal]

  # Respaldo diario de ambas bases (14 días, más semanales y mensuales) en ./backups.
  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    user: "0"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: kustodela,zitadel
      POSTGRES_EXTRA_OPTS: -Z6 --format=custom
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
      TZ: ${APP_TZ:-America/Mexico_City}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  uploads:
  pos_dist:
  caddy_data:
  caddy_config:
